<svg xmlns="http://www.w3.org/2000/svg" width="900" height="260" viewBox="0 0 900 260" role="img" aria-label="Terminal animado: William, Data e Machine Learning" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#050A12"/>
      <stop offset="1" stop-color="#0B1A2B"/>
    </linearGradient>
    <clipPath id="c1"><rect x="40" y="70" height="32" class="k1"/></clipPath>
    <clipPath id="c2"><rect x="40" y="110" height="32" class="k2"/></clipPath>
    <clipPath id="c3"><rect x="40" y="150" height="32" class="k3"/></clipPath>
  </defs>

  <style>
    text { font-family: 'Courier New', Consolas, Menlo, monospace; font-size: 20px; }
    .prompt { fill: #00BFFF; }
    .out    { fill: #CFE9FF; }
    .dim    { fill: #4A7FA8; }
    .jp     { fill: #00BFFF; font-size: 28px; opacity: 0; animation: jp 14s infinite; }
    .cursor { fill: #00BFFF; animation: blink 1s steps(1) infinite; }

    /* Digitação: cada linha revela um clipPath com steps() = nº de caracteres */
    .k1 { width: 0; animation: t1 14s infinite steps(8); }
    .k2 { width: 0; animation: t2 14s infinite steps(26); }
    .k3 { width: 0; animation: t3 14s infinite steps(34); }

    @keyframes t1 { 0% {width:0} 5% {width:100px} 96% {width:100px} 100% {width:0} }
    @keyframes t2 { 0%,8% {width:0} 22% {width:312px} 96% {width:312px} 100% {width:0} }
    @keyframes t3 { 0%,26% {width:0} 42% {width:408px} 96% {width:408px} 100% {width:0} }
    @keyframes jp { 0%,44% {opacity:0} 50% {opacity:1} 96% {opacity:1} 100% {opacity:0} }
    @keyframes blink { 0%,49% {opacity:1} 50%,100% {opacity:0} }
  </style>

  <!-- Janela do terminal -->
  <rect x="1" y="1" width="898" height="258" rx="14" fill="url(#bg)" stroke="#00BFFF" stroke-opacity="0.35"/>
  <rect x="1" y="1" width="898" height="40" rx="14" fill="#0E2238"/>
  <rect x="1" y="26" width="898" height="15" fill="#0E2238"/>
  <circle cx="28" cy="21" r="6" fill="#FF5F56"/>
  <circle cx="50" cy="21" r="6" fill="#FFBD2E"/>
  <circle cx="72" cy="21" r="6" fill="#27C93F"/>
  <text x="450" y="27" text-anchor="middle" class="dim" style="font-size:14px">william@github: ~</text>

  <!-- Linhas digitadas -->
  <g clip-path="url(#c1)"><text x="40" y="94"><tspan class="prompt">$ </tspan><tspan class="out">whoami</tspan></text></g>
  <g clip-path="url(#c2)"><text x="40" y="134" class="out">William | Data Engineering</text></g>
  <g clip-path="url(#c3)"><text x="40" y="174" class="dim">stack: Python · SQL · FastAPI · ML</text></g>

  <!-- Prompt final com cursor piscando -->
  <text x="40" y="224" class="prompt">$ </text>
  <rect x="62" y="207" width="11" height="22" class="cursor"/>

  <!-- Toque japonês (機械学習 = machine learning) -->
  <text x="860" y="100" text-anchor="end" class="jp">機械学習</text>
</svg>
